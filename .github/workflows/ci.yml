name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Verify committed bundle
        run: git diff --exit-code -- dist/

  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create current heartbeat
        run: |
          mkdir -p "$RUNNER_TEMP/heartbeat"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"check":"ci-smoke","last_run":"%s","last_all_success":"%s","failed_detectors":[]}\n' \
            "$NOW" "$NOW" > "$RUNNER_TEMP/heartbeat/status.json"
      - uses: ./
        with:
          path: ${{ runner.temp }}/heartbeat/status.json
          max-age-seconds: "60"
